# SNAPBUG memory layout -- VIC-20 with full expansion (3K + BLK1/2/3 + BLK5)
#
#  $0002-$00FF  zero page variables
#  $0400-$09FF  bgmap / colmap / overlay map (3K expansion, page aligned)
#  $0A00-$0FFF  other variables (3K expansion)
#  $1000-$11F7  screen (21x24)                      [VIC visible]
#  $1201-$17FF  BASIC "SYS" stub                    [loaded]
#  $1800-$1FFF  character set (256 chars)           [loaded, VIC visible]
#  $2000-$6FFF  code + data                         [loaded, BLK1-3]
#  $7000-$7FFF  pre-shifted sprite pages 32+        [generated]
#  $A000-$BFFF  pre-shifted sprite pages 0-31       [generated, BLK5]
MEMORY {
    ZP:      start = $0002, size = $00FE, type = rw;
    LOADADR: start = $0000, size = $0002, file = %O;
    STUB:    start = $1201, size = $05FF, file = %O, fill = yes;
    CHARS:   start = $1800, size = $0800, file = %O, fill = yes;
    MAIN:    start = $2000, size = $5000, file = %O;
    LOBSS:   start = $0A00, size = $0600, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    LOADADDR: load = LOADADR, type = ro;
    STUB:     load = STUB,    type = ro;
    CHARS:    load = CHARS,   type = ro;
    CODE:     load = MAIN,    type = ro;
    RODATA:   load = MAIN,    type = ro;
    BSS:      load = LOBSS,   type = bss, define = yes;
}
