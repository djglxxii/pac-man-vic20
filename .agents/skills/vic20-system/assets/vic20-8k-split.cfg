# +8K (or more) assembly program: BASIC stub at $1201, code/data in BLK1 ($2000+),
# $1000-$1FFF left for the VIC (screen, colour page-flip, charset), filled at run time.
FEATURES {
    STARTADDRESS: default = $1201;
}
SYMBOLS {
    __LOADADDR__: type = import;
}
MEMORY {
    ZP:       file = "",  start = $0002, size = $001A, define = yes;
    LOADADDR: file = %O,  start = %S - 2, size = $0002;
    STUB:     file = %O,  start = %S,     size = $2000 - %S, fill = yes;  # stub + JMP, padded to $2000
    MAIN:     file = %O,  start = $2000,  size = $2000;                   # BLK1 ($6000 for +24K)
    VICRAM:   file = "",  start = $1000,  size = $1000;                   # not part of the file
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp,  optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = STUB,     type = ro;
    STARTUP:  load = STUB,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    DATA:     load = MAIN,     type = rw,  optional = yes;
    BSS:      load = MAIN,     type = bss, optional = yes, define = yes;
    VICDATA:  load = VICRAM,   type = bss, optional = yes, define = yes;
}
